<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar ERP + CRM</title>
    <meta name="description" content="Production-quality modern Solar EPC ERP and CRM platform with complete project workflow tracking, CRM, site survey, finance, HRMS, and service management." />
    <meta property="og:title" content="Solar ERP + CRM" />
    <meta property="og:description" content="Production-quality modern Solar EPC ERP and CRM platform with complete project workflow tracking, CRM, site survey, finance, HRMS, and service management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div id="rejoy-preloader" style="min-height: 100vh; background-color: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #f59e0b, #d97706); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </div>
        <div style="font-size: 17px; font-weight: 700; color: #ffffff; letter-spacing: -0.01em; margin-bottom: 8px;">SolarPulse EPC ERP & CRM</div>
        <div style="display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 13px;">
          <div style="width: 14px; height: 14px; border: 2px solid #f59e0b; border-top-color: transparent; border-radius: 50%; animation: rejoy-spin 0.8s linear infinite;"></div>
          <span>Loading Rejoy Solar workspace...</span>
        </div>
        <style>
          @keyframes rejoy-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script>
      // Production resilience: catch script loading errors or exceptions before React mounts
      window.addEventListener('error', function(e) {
        var pre = document.getElementById('rejoy-preloader');
        if (pre) {
          console.error('[Production Loader Error]', e.error || e.message);
          var msg = (e && e.message) ? e.message : 'Unknown runtime script error';
          pre.innerHTML = '<div style="max-width: 420px; padding: 24px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; text-align: center;">' +
            '<div style="color: #f87171; font-size: 16px; font-weight: 700; margin-bottom: 8px;">Unable to load Solar ERP</div>' +
            '<div style="color: #94a3b8; font-size: 12px; margin-bottom: 16px; font-family: monospace; word-break: break-all;">' + msg + '</div>' +
            '<button onclick="try { window.localStorage && window.localStorage.clear(); } catch(err) {} window.location.reload();" style="padding: 8px 16px; background: #f59e0b; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Reload Application</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
